name: Java CI mit Maven

# 1. Hier wird festgelegt, wann die Pipeline startet
on:
  push:
    # GitHub startet jetzt, egal ob dein Branch 'main' oder 'master' heißt
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repository auschecken
      uses: actions/checkout@v4

    - name: Java (Temurin 17) einrichten
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'maven'

    - name: Projekt mit Maven bauen und testen
      run: mvn clean verify


  